on:
  pull_request_target:

jobs:
  modeled-reviewer:
    environment: modeled-reviewer
    runs-on: ubuntu-latest
    steps:
      - run: echo protected

  modeled-wait-timer:
    environment: modeled-wait-timer
    runs-on: ubuntu-latest
    steps:
      - run: echo delayed

  modeled-unprotected:
    environment:
      name: modeled-unprotected
      url: https://unprotected.example.test
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - run: echo unprotected

  unmodeled:
    environment:
      name: preview-${{ github.event.pull_request.number }}
      url: https://${{ github.event.pull_request.number }}.example.test
      deployment: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: echo unmodeled