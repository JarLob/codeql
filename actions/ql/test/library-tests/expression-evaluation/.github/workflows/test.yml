"on":
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      foo:
        type: string

jobs:
  event-name:
    if: "github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - run: echo event

  event-action:
    if: "github.event.action == 'labeled'"
    runs-on: ubuntu-latest
    steps:
      - run: echo action

  partial-and:
    if: "github.event_name == 'workflow_dispatch' && github.actor == 'octocat'"
    runs-on: ubuntu-latest
    steps:
      - run: echo and

  partial-or:
    if: "github.event_name == 'workflow_dispatch' || github.actor == 'octocat'"
    runs-on: ubuntu-latest
    steps:
      - run: echo or

  unknown:
    if: "github.actor == 'octocat'"
    runs-on: ubuntu-latest
    steps:
      - run: echo unknown

  literals:
    if: "!(false || 2 < 1) && contains('CodeQL', 'deq')"
    runs-on: ubuntu-latest
    steps:
      - run: echo literals

  string-functions-true:
    if: "startsWith('CodeQL', 'code') && endsWith('CodeQL', 'QL')"
    runs-on: ubuntu-latest
    steps:
      - run: echo matching string functions

  string-functions-false:
    if: "startsWith('CodeQL', 'QL') || endsWith('CodeQL', 'code')"
    runs-on: ubuntu-latest
    steps:
      - run: echo nonmatching string functions

  zero-literal:
    if: "${{ 0 || false }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo zero

  nonzero-literal:
    if: "${{ 1 && true }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo nonzero

  empty-string-literal:
    if: "${{ '' || false }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo empty string

  null-literal:
    if: "${{ null || false }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo null

  typed-comparisons-true:
    if: "true == !false && null == null && 2 >= 2 && 3 > 2 && 1 <= 1"
    runs-on: ubuntu-latest
    steps:
      - run: echo matching typed comparisons

  typed-comparisons-false:
    if: "true != true || null != null || 2 < 1 || 1 > 2"
    runs-on: ubuntu-latest
    steps:
      - run: echo nonmatching typed comparisons

  always:
    if: "always()"
    runs-on: ubuntu-latest
    steps:
      - run: echo always

  missing-pr-payload:
    if: "contains(github.event.pull_request.labels.*.name, 'safe')"
    runs-on: ubuntu-latest
    steps:
      - run: echo payload

  dispatch-input:
    if: "github.event.inputs.foo == 'bar'"
    runs-on: ubuntu-latest
    steps:
      - run: echo input

  success-status:
    if: "success()"
    runs-on: ubuntu-latest
    steps:
      - run: echo success

  success-or-event:
    if: "success() || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - run: echo status or event

  not-success-status:
    if: "!success()"
    runs-on: ubuntu-latest
    steps:
      - run: echo not success

  failure-status:
    if: "failure()"
    runs-on: ubuntu-latest
    steps:
      - run: echo failure

  cancelled-status:
    if: "cancelled()"
    runs-on: ubuntu-latest
    steps:
      - run: echo cancelled

  combined-status:
    if: "failure() && cancelled()"
    runs-on: ubuntu-latest
    steps:
      - run: echo combined

  matrix-scalars:
    strategy:
      matrix:
        os: [ubuntu, windows]
        experimental: [true, false]
        version: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - id: compound
        if: "matrix.os == 'windows' && matrix.experimental"
        run: echo compound
      - id: numeric
        if: "matrix.version >= 2"
        run: echo numeric
      - id: string-function
        if: "startsWith(matrix.os, 'win')"
        run: echo string function
      - id: direct-boolean
        if: "matrix.experimental"
        run: echo direct boolean
      - id: partial-unknown
        if: "matrix.os == 'windows' && github.actor == 'octocat'"
        run: echo partially unknown
      - id: status-and-matrix
        if: "success() && matrix.experimental"
        run: echo status and matrix

  matrix-structured:
    strategy:
      matrix:
        platform:
          - os: ubuntu
            experimental: false
          - os: windows
            experimental: true
    runs-on: ubuntu-latest
    steps:
      - id: nested
        if: "matrix.platform.os == 'windows' && matrix.platform.experimental"
        run: echo nested

  matrix-types:
    strategy:
      matrix:
        nullable: [null]
        text: ["false"]
    runs-on: ubuntu-latest
    steps:
      - id: null-equality
        if: "matrix.nullable == null"
        run: echo null
      - id: quoted-false
        if: "matrix.text"
        run: echo quoted false is a nonempty string