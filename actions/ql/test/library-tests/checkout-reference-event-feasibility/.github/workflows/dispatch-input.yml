name: Workflow dispatch input

"on":
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true

jobs:
  dispatch-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          ref: ${{ inputs.ref }}