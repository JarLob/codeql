name: Direct event input absence

"on":
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  input-specific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          ref: ${{ inputs.ref }}