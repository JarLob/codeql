  large-fan-in:
    needs:
      - anchor-load-000
      - anchor-load-001
      - anchor-load-002
      - anchor-load-003
      - anchor-load-004
      - anchor-load-005
      - anchor-load-006
      - anchor-load-007
      - anchor-load-008
      - anchor-load-009
      - anchor-load-010
      - anchor-load-011
      - anchor-load-012
      - anchor-load-013
      - anchor-load-014
      - anchor-load-015
    if: always() && needs.anchor-load-000.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo large fan-in

  unsupported-result-fan-in:
    needs:
      - anchor-load-000
      - anchor-load-001
      - anchor-load-002
      - anchor-load-003
      - anchor-load-004
      - anchor-load-005
      - anchor-load-006
      - anchor-load-007
      - anchor-load-008
      - anchor-load-009
      - anchor-load-010
      - anchor-load-011
      - anchor-load-012
      - anchor-load-013
      - anchor-load-014
      - anchor-load-015
    if: >-
      always() &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-000.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-001.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-002.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-003.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-004.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-005.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-006.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-007.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-008.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-009.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-010.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-011.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-012.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-013.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-014.result) &&
      contains(fromJSON('["success","skipped"]'), needs.anchor-load-015.result)
    runs-on: ubuntu-latest
    steps:
      - run: echo unsupported result fan-in

  root-a:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decision.outputs.value }}
    steps:
      - id: decision
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "value=run" >> "$GITHUB_OUTPUT"

  root-b:
    runs-on: ubuntu-latest
    steps:
      - run: echo root-b

  root-c:
    runs-on: ubuntu-latest
    steps:
      - run: echo root-c

  root-d:
    runs-on: ubuntu-latest
    steps:
      - run: echo root-d

  root-e:
    runs-on: ubuntu-latest
    steps:
      - run: echo root-e

  condition-free-fan-in:
    needs: [root-a, root-b, root-c, root-d, root-e]
    runs-on: ubuntu-latest
    steps:
      - run: echo fan-in

  output-gate:
    needs: [root-a, root-b, root-c, root-d, root-e]
    if: always() && needs.root-a.outputs.decision == 'run'
    runs-on: ubuntu-latest
    steps:
      - run: echo output-gate

  ordered-conditions:
    runs-on: ubuntu-latest
    steps:
      - id: guarded
        if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
        run: echo guarded
      - id: after-guarded
        run: echo after

  matrix-static:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [one, two, three]
    runs-on: ${{ matrix.os }}
    steps:
      - id: static-default
        run: echo default
      - id: static-false
        continue-on-error: false
        run: echo false
      - id: static-true
        if: matrix.shard != ''
        continue-on-error: true
        run: echo true

  matrix-dynamic:
    strategy:
      matrix:
        experimental: [true, false]
        shard: [one, two]
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    steps:
      - id: dynamic
        continue-on-error: ${{ matrix.experimental }}
        run: echo dynamic

  matrix-capped:
    strategy:
      matrix:
        first: [a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q]
        second: [a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p]
    continue-on-error: ${{ matrix.first == 'a' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo capped