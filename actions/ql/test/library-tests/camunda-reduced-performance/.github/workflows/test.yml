name: Reduced Camunda performance topology

on:
  push:
  pull_request:
  workflow_dispatch:
  issue_comment:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  anchor-load-000: &anchor-load
    runs-on: ubuntu-latest
    container: ${{ github.repository }}
    steps:
      - run: echo "${{ github.actor }}"
      - run: echo "${{ github.ref }}"
      - run: echo "${{ github.sha }}"
      - run: echo "${{ github.workflow }}"
      - run: echo "${{ github.job }}"
      - run: echo "${{ github.run_id }}"
      - run: echo "${{ github.event_name }}"
      - run: echo "${{ github.repository }}"

  anchor-load-001: *anchor-load
  anchor-load-002: *anchor-load
  anchor-load-003: *anchor-load
