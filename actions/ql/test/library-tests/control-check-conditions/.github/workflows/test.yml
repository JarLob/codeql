on:
  pull_request_target:

jobs:
  exact-member:
    if: github.event.pull_request.author_association == 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - run: echo exact member

  reversed-owner:
    if: "'OWNER' == github.event.pull_request.author_association"
    runs-on: ubuntu-latest
    steps:
      - run: echo reversed owner

  bypassable-member:
    if: >-
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - run: echo bypassable member

  label-only:
    if: contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - run: echo label

  non-fork-exact:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo local branch

  non-fork-reversed:
    if: false == github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - run: echo local branch

  non-fork-not-true:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - run: echo local branch

  non-fork-negated:
    if: "!github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    steps:
      - run: echo local branch

  non-fork-bypassable:
    if: >-
      github.event.pull_request.head.repo.fork == false ||
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - run: echo bypassable

  fork-exact:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - run: echo fork

  fork-not-false:
    if: github.event.pull_request.head.repo.fork != false
    runs-on: ubuntu-latest
    steps:
      - run: echo fork

  non-fork-string-false:
    if: github.event.pull_request.head.repo.fork == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo string false

  non-fork-string-not-true:
    if: github.event.pull_request.head.repo.fork != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo string true

  identity-or-non-fork:
    if: >-
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo trusted identity or local branch

  renovate-non-fork:
    if: >-
      (github.actor == 'renovate[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'renovatebot')) &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo renovate

  pr-repository-full-name: # Expected: recognized, protective, and required on the true path.
    if: >-
      github.actor == 'octocat' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo exact repository

  pr-repository-owner: # Expected: recognized, protective, and required on the true path.
    if: >-
      github.actor == 'octocat' &&
      github.event.pull_request.head.repo.owner.name == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - run: echo exact owner

  pr-repository-bypassable: # Expected: recognized but not protective or required due to the OR branch.
    if: >-
      (github.actor == 'octocat' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - run: echo bypassable repository