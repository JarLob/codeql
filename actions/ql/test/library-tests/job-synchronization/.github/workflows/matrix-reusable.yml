"on":
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      active:
        required: true
        type: boolean
      retries:
        required: true
        type: number
    secrets:
      token:
        required: true
    outputs:
      selected:
        value: "${{ jobs.matrix-reusable-terminal.outputs.selected }}"
      active:
        value: "${{ jobs.matrix-reusable-terminal.outputs.active }}"
      retries:
        value: "${{ jobs.matrix-reusable-terminal.outputs.retries }}"
      direct:
        value: "${{ 'matrix-direct' }}"

jobs:
  matrix-reusable-terminal:
    continue-on-error: true
    outputs:
      selected: "${{ inputs.target }}"
      active: "${{ inputs.active }}"
      retries: "${{ inputs.retries }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.target }} ${{ inputs.active }} ${{ inputs.retries }} ${{ secrets.token }}" && exit 1