on:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        type: boolean
      matrix:
        type: string

jobs:
  guarded:
    if: "github.event_name == 'workflow_dispatch' && !cancelled()"
    runs-on: ubuntu-latest
    env:
      WRAPPED: "prefix ${{ github.actor }} suffix"
      FOLDED: >-
        prefix ${{ github.repository }}
        suffix
      ESCAPED: "prefix\t${{ github.ref }} suffix"
    steps:
      - if: "contains(github.event.pull_request.labels.*.name, 'safe') || inputs.force == true"
        run: echo guarded
      - if: "fromJSON(inputs.matrix)[0].enabled != null"
        run: echo indexed

  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        payload.with.dot: ["${{ inputs.matrix }}"]
        object:
          - nested: ["${{ inputs.matrix }}"]
    steps:
      - run: |
          echo "${{ format('{0}', matrix['payload.with.dot']) }}"
          echo "${{ matrix.object.nested[0] }}"
          echo "${{ toJSON(matrix) }}"