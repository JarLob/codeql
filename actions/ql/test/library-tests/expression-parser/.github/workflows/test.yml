on:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        type: boolean
      matrix:
        type: string

jobs:
  guarded:
    if: "github.event_name == 'workflow_dispatch' && !cancelled()"
    runs-on: ubuntu-latest
    steps:
      - if: "contains(github.event.pull_request.labels.*.name, 'safe') || inputs.force == true"
        run: echo guarded
      - if: "fromJSON(inputs.matrix)[0].enabled != null"
        run: echo indexed