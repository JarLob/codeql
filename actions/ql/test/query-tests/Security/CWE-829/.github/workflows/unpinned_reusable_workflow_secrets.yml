on:
  pull_request:

jobs:
  inherited-unpinned:
    uses: third-party/workflows/.github/workflows/build.yml@main
    secrets: inherit

  mapped-unpinned:
    uses: third-party/workflows/.github/workflows/build.yml@v1
    secrets:
      token: ${{ secrets.TOKEN || secrets.FALLBACK_TOKEN }}

  inherited-pinned:
    uses: third-party/workflows/.github/workflows/build.yml@25b062c917b0c75f8b47d8469aff6c94ffd89abb
    secrets: inherit

  no-secrets-unpinned:
    uses: third-party/workflows/.github/workflows/build.yml@main

  trusted-owner-unpinned:
    uses: actions/workflows/.github/workflows/build.yml@main

  local-workflow-with-at:
    uses: ./.github/workflows/build@local.yml

  local-action-with-at:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup@local
