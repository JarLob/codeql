on:
  pull_request:
  pull_request_target:

jobs:
  pull-request-only: # Expected: no alert; non-code findings are suppressed in pull_request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-download-artifact@v2
        with:
          name: artifact_name
          path: foo
      - run: sh foo/cmd