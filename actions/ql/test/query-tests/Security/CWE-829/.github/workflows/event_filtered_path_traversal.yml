on:
  pull_request:
  pull_request_target:

jobs:
  upload:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bash script.sh
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results

  download:
    if: github.event_name == 'pull_request'
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.0.0
        with:
          name: results