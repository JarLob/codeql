on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  test:
    if: contains(github.event.pull_request.labels.*.name, 'safe to test')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./cmd