name: Protected bracket consumer # Expected: no alert; both checkout inputs are protected.
on:
  workflow_run:
    workflows: [Comment source]
    branches: [main]
    types: [completed]
permissions: write-all
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run['head_repository']['full_name'] }}
          ref: ${{ github.event.workflow_run['head_sha'] }}
