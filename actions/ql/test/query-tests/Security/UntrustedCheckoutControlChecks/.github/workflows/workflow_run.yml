on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions: write-all

jobs:
  pull-request-nonprivileged: # Expected: medium untrusted checkout from a source-correlated PR run.
    if: github.event.workflow_run.event == 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
          ref: ${{ github.event.workflow_run.pull_requests[0].head.ref }}

  repository-protected: # Expected: no alert; every run requires code from the base repository.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

  repository-bypass: # Expected: improper access control; the failure branch bypasses repository provenance.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

  event-specific-label: # Expected: untrusted checkout; the push label arm cannot authorize issues runs.
    if: >-
      (github.event.workflow_run.event == 'push' &&
       github.event.label.name == 'build::review') ||
      (github.event.workflow_run.event ==
       'issues')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}