on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions: write-all

jobs:
  repository-protected: # Expected: no alert; every run requires code from the base repository.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

  repository-bypass: # Expected: improper access control; the failure branch bypasses repository provenance.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

  event-specific-label: # Expected: untrusted checkout; the label arm is unreachable for workflow_run.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'build::review') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}