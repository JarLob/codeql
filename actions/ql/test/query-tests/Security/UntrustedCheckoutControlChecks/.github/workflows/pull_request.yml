on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  trigger-discriminated-label: # Expected: no alert; pull_request is the isolated context intended to run PR-head code.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}