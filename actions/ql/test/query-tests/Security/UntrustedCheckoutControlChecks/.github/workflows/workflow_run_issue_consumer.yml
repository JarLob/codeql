name: Comment consumer
on:
  workflow_run:
    workflows: [Comment source]
    branches: [main]
    types: [completed]
permissions: write-all
jobs:
  ineffective-permission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-cool/check-user-permission@v2
        with:
          require: write
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
          ref: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
      - run: npm test

  event-specific-label: # Expected: critical alert; the push label arm cannot authorize review runs.
    if: >-
      (github.event.workflow_run.event == 'push' &&
       github.event.label.name == 'approved') ||
      github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
          ref: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
      - run: npm test
