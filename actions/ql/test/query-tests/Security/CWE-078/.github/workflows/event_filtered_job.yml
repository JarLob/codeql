on:
  pull_request:
  pull_request_target:

jobs:
  pull-request-only: # Expected: no alert; non-code findings are suppressed in pull_request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v2
        with:
          ruby-version: ${{ github.event.pull_request.title }}