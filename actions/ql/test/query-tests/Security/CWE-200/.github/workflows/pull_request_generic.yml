on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Expected: no alert; non-code findings are suppressed in isolated pull_request.
      - uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.pullrequest.key=${{ github.event.pull_request.title }}