name: Unsafe composite ref

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  install: # Expected: critical TOCTOU alert; this caller supplies a mutable PR merge ref.
    if: github.actor == 'maintainer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/composite-ref
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge