name: Safe composite ref

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  install: # Expected: no alert; this caller binds the composite checkout to trusted base code.
    if: github.actor == 'maintainer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/composite-ref
        with:
          ref: ${{ github.event.repository.default_branch }}