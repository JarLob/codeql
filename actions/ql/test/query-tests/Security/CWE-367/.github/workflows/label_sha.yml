name: Label Triggered SHA Test
on:
  pull_request_target:
    types: [labeled]
    branches: [main]

jobs:
  integration-tests: # Expected: no TOCTOU alert; this label-triggered checkout uses an immutable SHA.
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - run: bash label_example/tests.sh

  checkout-only: # Expected: no TOCTOU alert; label-triggered SHA checkout is outside the comment race.
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}