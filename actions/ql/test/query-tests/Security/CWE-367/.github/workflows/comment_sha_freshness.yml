name: Freshness-checked comment SHA
on:
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  test: # Expected: no TOCTOU alert; the modeled freshness check suppresses the SHA checkout and execution.
    if: ${{ github.event.issue.pull_request && contains(fromJson('["MEMBER", "OWNER"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/run-tests ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        id: issue
        with:
          script: |
            const pr = context.payload.issue.number
            const data = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            })
            return {
              sha: data.data.head.sha,
            }
      - name: Reject commits pushed after the approval comment
        env:
          COMMENT_AT: ${{ github.event.comment.created_at }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh api "/repos/${GH_REPO}/pulls/${PR_NUMBER}")" || {
            echo "Unable to retrieve pull request" >&2
            exit 1
          }

          # jq avoids GNU date -d and -j avoids CRLF in command substitutions on Windows.
          # "pushed_at" can be null, but fromdateiso8601 invocation will fail in that case.
          pushed_epoch="$(
            jq -erj '.head.repo.pushed_at | fromdateiso8601' <<<"$pr"
          )" || {
            echo "Unable to parse the repository push timestamp" >&2
            exit 1
          }

          comment_epoch="$(
            jq -nerj --arg value "$COMMENT_AT" '$value | fromdateiso8601'
          )" || {
            echo "Unable to parse the approval comment timestamp" >&2
            exit 1
          }

          # Both timestamps have one-second precision, so equality must be rejected.
          if (( pushed_epoch >= comment_epoch )); then
            # pushed_at covers the entire fork repository, not only the PR branch,
            # so this check is conservative and may reject some valid PRs.
            echo "The repository was pushed to at or after the approval comment" >&2
            exit 1
          fi

          # The checkout uses the SHA resolved before this check, so a later push cannot change it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.issue.outputs.result).sha }}
      - run: bash comment_example/tests.sh

  checkout-only: # Expected: no TOCTOU alert; the modeled freshness check suppresses the SHA checkout.
    if: ${{ github.event.issue.pull_request && contains(fromJson('["MEMBER", "OWNER"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/run-tests ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        id: issue
        with:
          script: |
            const pr = context.payload.issue.number
            const data = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            })
            return {
              sha: data.data.head.sha,
            }
      - name: Reject commits pushed after the approval comment
        env:
          COMMENT_AT: ${{ github.event.comment.created_at }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh api "/repos/${GH_REPO}/pulls/${PR_NUMBER}")" || {
            echo "Unable to retrieve pull request" >&2
            exit 1
          }

          # jq avoids GNU date -d and -j avoids CRLF in command substitutions on Windows.
          # "pushed_at" can be null, but fromdateiso8601 invocation will fail in that case.
          pushed_epoch="$(
            jq -erj '.head.repo.pushed_at | fromdateiso8601' <<<"$pr"
          )" || {
            echo "Unable to parse the repository push timestamp" >&2
            exit 1
          }

          comment_epoch="$(
            jq -nerj --arg value "$COMMENT_AT" '$value | fromdateiso8601'
          )" || {
            echo "Unable to parse the approval comment timestamp" >&2
            exit 1
          }

          # Both timestamps have one-second precision, so equality must be rejected.
          if (( pushed_epoch >= comment_epoch )); then
            # pushed_at covers the entire fork repository, not only the PR branch,
            # so this check is conservative and may reject some valid PRs.
            echo "The repository was pushed to at or after the approval comment" >&2
            exit 1
          fi

          # The checkout uses the SHA resolved before this check, so a later push cannot change it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.issue.outputs.result).sha }}