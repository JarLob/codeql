name: Privileged binding update

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      ref:
        required: true
        type: string
      update_command:
        required: true
        type: string
    secrets:
      CI_ACCESS_TOKEN:
        required: true

jobs:
  update: # Expected: one critical alert; comment-selected code reaches caller-supplied cargo execution.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: binding
          token: ${{ secrets.CI_ACCESS_TOKEN }}
      - run: |
          ./.github/scripts/prepare.sh
          ${{ inputs.update_command }} --manifest-path binding/Cargo.toml