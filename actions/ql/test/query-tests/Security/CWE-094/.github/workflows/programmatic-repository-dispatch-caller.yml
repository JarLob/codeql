name: Programmatic repository dispatch caller

on:
  issue_comment:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          event-type: security-scan
          client-payload: |
            {
              "message": ${{ toJSON(github.event.comment.body) }}
            }