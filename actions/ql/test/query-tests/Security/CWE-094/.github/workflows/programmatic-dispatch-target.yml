name: Programmatic dispatch target

on:
  workflow_dispatch:
    inputs:
      message:
        required: true
        type: string

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      # Expected: actions/code-injection/critical
      - run: echo '${{ inputs.message }}'
      # Expected: actions/code-injection/critical
      - run: echo '${{ github.event.inputs.message }}'