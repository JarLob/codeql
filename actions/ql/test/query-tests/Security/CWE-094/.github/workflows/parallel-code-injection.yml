on:
  issue_comment:

permissions:
  contents: write

jobs:
  parallel-injection:
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - id: vulnerable-run
            run: echo "${{ github.event.comment.body }}"
          - id: sibling-action
            uses: actions/github-script@v7
            with:
              script: console.log('sibling')