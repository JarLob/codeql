name: Programmatic repository dispatch key negative caller

on:
  issue_comment:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          event-type: key-negative
          client-payload: |
            {
              "message": "constant",
              "safe": ${{ toJSON(github.event.comment.body) }}
            }