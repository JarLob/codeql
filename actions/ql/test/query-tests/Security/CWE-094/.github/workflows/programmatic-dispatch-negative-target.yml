name: Programmatic dispatch negative target

on:
  workflow_dispatch:
    inputs:
      message:
        required: true
        type: string
      safe:
        required: true
        type: string

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      # Expected: critical for the untrusted push source, without borrowing issue-comment provenance.
      - run: echo '${{ github.event.inputs.message }}'