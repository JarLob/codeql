on:
  workflow_dispatch:
    inputs:
      head_sha:
        required: true
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: "${{ 'run' }}"
      disabled: "${{ 'stop' }}"
    steps:
      - run: echo gate

  enabled:
    needs: gate
    if: needs.gate.outputs.enabled == 'run'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .npm
          key: output-enabled

  disabled:
    needs: gate
    if: needs.gate.outputs.disabled == 'run'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .npm
          key: output-disabled