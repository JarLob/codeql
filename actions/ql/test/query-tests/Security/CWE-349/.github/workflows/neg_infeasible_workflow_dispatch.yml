on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        required: true

jobs:
  downstream:
    if: "contains(github.event.pull_request.labels.*.name, 'downstream tests')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ref: ["${{ github.event.inputs.ref }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: example/example
          ref: ${{ matrix.ref }}
      - run: npm install