on: workflow_run

jobs:
  guarded:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .npm
          key: guarded

  opted-out:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}
          allow-unsafe-pr-checkout: true
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .npm
          key: opted-out
